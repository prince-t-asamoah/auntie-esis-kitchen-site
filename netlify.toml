# Plain static site: no build step, publish the repo root.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Image files never change in place; a new photo gets a new file name.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS and JS keep their names, so browsers revalidate them.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Keep docs, scripts and npm files off the live site.
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true
